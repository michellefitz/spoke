name: Spoke
options:
  bundleIdPrefix: com.michellefitzpatrick
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    # iPhone only — without these, every regeneration re-adds the derived
    # iPad / Mac / Apple Vision destinations that then have to be deleted
    # by hand in Xcode.
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    SUPPORTS_MACCATALYST: false
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
    PRODUCT_BUNDLE_IDENTIFIER: com.michellefitzpatrick.Spoke
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_STRICT_CONCURRENCY: targeted
    # Let Xcode pick the signing identity: Apple Development for local
    # builds, Apple Distribution when archiving. Never pin the identity by
    # hand — a hardcoded development cert makes archives upload-rejected.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: TD9H5RA3U9

targets:
  Spoke:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Spoke
        excludes:
          - "Info.plist"
    info:
      path: Spoke/Info.plist
      properties:
        CFBundleDisplayName: Spoke
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "3"
        ITSAppUsesNonExemptEncryption: false
        # Keeps recording when you glance at another app mid-braindump,
        # the way voice notes do. Without this iOS suspends Spoke and the
        # microphone goes dead with no warning.
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: "Spoke uses the microphone to capture your voice tasks."
        NSCalendarsFullAccessUsageDescription: "Spoke shows your calendar appointments alongside your tasks, and adds or updates events when you ask it to — always with your confirmation."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
    entitlements:
      path: Spoke/Spoke.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.michellefitzpatrick.Spoke
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.michellefitzpatrick.Spoke
        SWIFT_STRICT_CONCURRENCY: targeted
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: SpokeWidgetExtension
    scheme:
      testTargets: []

  SpokeWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SpokeWidget
      - path: Spoke/Models/Task.swift
      - path: Spoke/Models/SharedContainer.swift
    entitlements:
      path: SpokeWidget/SpokeWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.michellefitzpatrick.Spoke
    info:
      path: SpokeWidget/Info.plist
      properties:
        CFBundleDisplayName: Spoke Widget
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "3"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.michellefitzpatrick.Spoke.SpokeWidget
        SWIFT_STRICT_CONCURRENCY: targeted
