<title>Spoke — character sketch</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --paper: #faf7f0;
    --ink: #22201c;
    --ink2: rgba(34,32,28,.55);
    --coral: #FF6147;
    --bg: #efebe2;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #191713; --paper: #f5f1e8; }
  }
  :root[data-theme="dark"] { --bg: #191713; --paper: #f5f1e8; }
  :root[data-theme="light"] { --bg: #efebe2; --paper: #faf7f0; }

  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px;
    background:var(--bg); padding:24px 14px;
    font-family: Georgia, "Times New Roman", serif;
  }
  .panel-wrap { width:100%; max-width:720px; }
  svg { width:100%; height:auto; display:block; }

  .stroke { stroke:var(--ink); stroke-width:2.2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .fill-paper { fill:var(--paper); }
  .bubble-text {
    font-family:"Chalkboard SE","Comic Sans MS","Segoe Print",cursive;
    font-size:15px; fill:var(--ink);
  }

  .caption {
    text-align:center; font-style:italic; font-size:17px; color:var(--ink);
    opacity:0; transform:translateY(6px); transition:opacity .8s, transform .8s;
  }
  .caption.show { opacity:1; transform:none; }
  .caption .wordmark {
    display:block; margin-top:10px; font-style:normal;
    font-family:-apple-system, BlinkMacSystemFont, sans-serif;
    font-size:14px; font-weight:600; letter-spacing:-0.2px; color:var(--ink);
  }
  .caption .dot { color:var(--coral); }

  .replay {
    font-family:-apple-system, BlinkMacSystemFont, sans-serif;
    font-size:13px; font-weight:600; color:var(--coral);
    background:none; border:1.5px dashed var(--coral); border-radius:999px;
    padding:8px 16px; cursor:pointer; opacity:0; transition:opacity .5s;
  }
  .replay.show { opacity:1; }

  /* bubbles */
  .bubble { opacity:0; }
  .bubble.in { animation: fallIn .9s cubic-bezier(.25,1.2,.4,1) forwards, sway 3.4s ease-in-out 1s infinite; }
  @keyframes fallIn { from { opacity:0; transform:translateY(-140px) rotate(-3deg); } to { opacity:1; transform:translateY(0) rotate(0deg); } }
  @keyframes sway { 0%,100% { transform:translateY(0) rotate(0deg);} 50% { transform:translateY(-5px) rotate(1.2deg);} }
  .bubble.pop { animation: pop .35s ease-in forwards; }
  @keyframes pop { 40% { transform:scale(1.08); opacity:1; } 100% { transform:scale(0); opacity:0; } }

  /* walker */
  #walker { }
  #walker .pose { visibility:hidden; }
  #walker .pose.on { visibility:visible; }
  #scribble { opacity:0; }
  .writing #scribble { opacity:1; }
  .writing #scribArm { animation: wiggle .22s ease-in-out infinite; transform-origin: 6px -70px; }
  @keyframes wiggle { 0%,100% { transform:rotate(0deg);} 50% { transform:rotate(-7deg);} }

  #listGroup, #tableGroup { opacity:0; }
  #listGroup.show { animation: dropIn .5s cubic-bezier(.3,1.4,.5,1) forwards; }
  #tableGroup.show { opacity:1; transition:opacity .3s; }
  @keyframes dropIn { from { opacity:0; transform:translateY(-26px);} to { opacity:1; transform:translateY(0);} }
  #listGroup .row { opacity:0; transition:opacity .25s; }
  #listGroup .row.show { opacity:1; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation:none !important; transition:none !important; }
  }
</style>

<div class="panel-wrap">
<svg viewBox="0 0 900 560" aria-label="A small line-drawn assistant walks in, writes down falling speech bubbles, leaves a tidy list on a table, and walks off.">
  <defs>
    <filter id="ink" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6"/>
    </filter>
  </defs>

  <!-- panel background + border -->
  <rect x="6" y="6" width="888" height="548" class="fill-paper"/>
  <g filter="url(#ink)">
    <rect x="14" y="14" width="872" height="532" class="stroke"/>
    <!-- ground line -->
    <path d="M40 470 L860 470" class="stroke" stroke-width="1.6" opacity="0.5"/>
  </g>

  <!-- speech bubbles -->
  <g id="bubbles">
    <g class="bubble" data-b="1" transform-origin="280 130">
      <g filter="url(#ink)">
        <ellipse cx="280" cy="130" rx="86" ry="30" class="stroke fill-paper"/>
        <path d="M290 100 q4 -14 12 -22" class="stroke"/>
      </g>
      <text x="280" y="136" text-anchor="middle" class="bubble-text">dentist tuesday</text>
    </g>
    <g class="bubble" data-b="2" transform-origin="475 92">
      <g filter="url(#ink)">
        <ellipse cx="475" cy="92" rx="46" ry="26" class="stroke fill-paper"/>
        <path d="M482 66 q3 -12 10 -18" class="stroke"/>
      </g>
      <text x="475" y="98" text-anchor="middle" class="bubble-text">MILK!</text>
    </g>
    <g class="bubble" data-b="3" transform-origin="650 150">
      <g filter="url(#ink)">
        <ellipse cx="650" cy="150" rx="82" ry="30" class="stroke fill-paper"/>
        <path d="M660 120 q4 -14 12 -22" class="stroke"/>
      </g>
      <text x="650" y="156" text-anchor="middle" class="bubble-text">book the MOT</text>
    </g>
    <g class="bubble" data-b="4" transform-origin="420 205">
      <g filter="url(#ink)">
        <ellipse cx="420" cy="205" rx="78" ry="29" class="stroke fill-paper"/>
        <path d="M430 176 q4 -13 11 -20" class="stroke"/>
      </g>
      <text x="420" y="211" text-anchor="middle" class="bubble-text">sam's party??</text>
    </g>
  </g>

  <!-- table + list -->
  <g id="tableGroup" filter="url(#ink)">
    <path d="M392 400 L508 400" class="stroke" stroke-width="2.6"/>
    <path d="M404 400 L398 470 M496 400 L502 470" class="stroke"/>
  </g>
  <g id="listGroup">
    <g filter="url(#ink)" transform="rotate(-2 450 340)">
      <rect x="405" y="285" width="90" height="112" rx="3" class="stroke fill-paper"/>
      <path d="M415 300 q20 -3 34 0" class="stroke" stroke-width="1.8"/>
    </g>
    <g class="row" transform="rotate(-2 450 340)">
      <rect x="415" y="312" width="8" height="8" class="stroke" stroke-width="1.6"/>
      <path d="M416 316 l3 4 l5 -8" fill="none" stroke="var(--coral)" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M430 317 h50" class="stroke" stroke-width="1.6"/>
    </g>
    <g class="row" transform="rotate(-2 450 340)">
      <rect x="415" y="330" width="8" height="8" class="stroke" stroke-width="1.6"/>
      <path d="M430 335 h44" class="stroke" stroke-width="1.6"/>
    </g>
    <g class="row" transform="rotate(-2 450 340)">
      <rect x="415" y="348" width="8" height="8" class="stroke" stroke-width="1.6"/>
      <path d="M430 353 h52" class="stroke" stroke-width="1.6"/>
    </g>
    <g class="row" transform="rotate(-2 450 340)">
      <rect x="415" y="366" width="8" height="8" class="stroke" stroke-width="1.6"/>
      <path d="M430 371 h38" class="stroke" stroke-width="1.6"/>
    </g>
  </g>

  <!-- walker -->
  <g id="walker" transform="translate(-80 470)">
    <g id="figure" filter="url(#ink)">
      <!-- legs: three poses -->
      <g class="pose" id="poseStand">
        <path d="M-3 -38 L-5 -1 M-5 -1 l10 1 M3 -38 L5 -1 M5 -1 l10 1" class="stroke"/>
      </g>
      <g class="pose" id="poseA">
        <path d="M-2 -38 L-16 -14 L-14 -1 M-14 -1 l10 1 M2 -38 L12 -16 L15 -1 M15 -1 l10 1" class="stroke"/>
      </g>
      <g class="pose" id="poseB">
        <path d="M-2 -38 L-7 -14 L-6 -1 M-6 -1 l10 1 M2 -38 L3 -14 L2 -1 M2 -1 l10 1" class="stroke"/>
      </g>
      <!-- body -->
      <path d="M-9 -82 Q-14 -58 -9 -38 L9 -38 Q14 -58 9 -82 Z" class="stroke fill-paper"/>
      <!-- tie? no — one small pocket line -->
      <path d="M-2 -76 l6 1" class="stroke" stroke-width="1.4" opacity="0.7"/>
      <!-- head -->
      <ellipse cx="2" cy="-97" rx="15" ry="14" class="stroke fill-paper"/>
      <circle cx="9" cy="-99" r="1.7" fill="var(--ink)"/>
      <path d="M15 -96 q4 2 1 6" class="stroke" stroke-width="1.6"/>
      <path d="M-8 -108 q4 -4 9 -4" class="stroke" stroke-width="1.4"/>
      <!-- arm + notepad -->
      <path d="M8 -72 Q20 -68 26 -61" class="stroke"/>
      <g transform="translate(32 -62) rotate(9)">
        <rect x="-9" y="-13" width="19" height="26" rx="2" class="stroke fill-paper" stroke-width="1.8"/>
        <path d="M-5 -6 h11 M-5 0 h9 M-5 6 h11" class="stroke" stroke-width="1.2" opacity="0.75"/>
      </g>
      <!-- scribbling arm + pencil -->
      <g id="scribArm">
        <path d="M6 -70 Q16 -60 24 -55" class="stroke"/>
        <path d="M24 -55 l7 -5" class="stroke" stroke-width="1.8"/>
      </g>
      <path id="scribble" d="M28 -50 q3 3 6 0 q3 -3 6 0" class="stroke" stroke-width="1.3" opacity="0.8"/>
    </g>
  </g>
</svg>
</div>

<p class="caption" id="caption">The to-do list you talk to.
  <span class="wordmark">spoke<span class="dot"> •</span></span>
</p>
<button class="replay" id="replay">Play it again</button>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const walker = $('walker'), figure = $('figure');
  const bubbles = Array.from(document.querySelectorAll('.bubble'));
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let walkTimer = null, bob = false;

  function setPose(name) {
    ['poseStand', 'poseA', 'poseB'].forEach(p => $(p).classList.toggle('on', p === name));
  }

  function startWalking() {
    let a = true;
    setPose('poseA');
    walkTimer = setInterval(() => {
      a = !a;
      setPose(a ? 'poseA' : 'poseB');
      bob = !bob;
      figure.setAttribute('transform', bob ? 'translate(0 -2)' : '');
    }, 150);
  }
  function stopWalking() {
    clearInterval(walkTimer);
    setPose('poseStand');
    figure.setAttribute('transform', '');
  }

  function moveWalker(fromX, toX, ms) {
    return new Promise(resolve => {
      const anim = walker.animate(
        [{ transform: `translate(${fromX}px, 470px)` }, { transform: `translate(${toX}px, 470px)` }],
        { duration: ms, easing: 'linear', fill: 'forwards' }
      );
      anim.onfinish = resolve;
    });
  }

  function finalScene() {
    $('tableGroup').style.opacity = 1;
    $('listGroup').style.opacity = 1;
    document.querySelectorAll('#listGroup .row').forEach(r => r.classList.add('show'));
    $('caption').classList.add('show');
    $('replay').classList.add('show');
    walker.setAttribute('transform', 'translate(-80 470)');
  }

  async function play() {
    if (reduced) { finalScene(); return; }

    setPose('poseStand');
    await sleep(500);

    // bubbles fall from the sky
    for (const b of bubbles) {
      b.classList.add('in');
      await sleep(340);
    }
    await sleep(500);

    // assistant walks in
    startWalking();
    await moveWalker(-80, 330, 2700);
    stopWalking();

    // takes notes; bubbles pop one by one
    walker.classList.add('writing');
    await sleep(500);
    for (const b of bubbles) {
      b.classList.remove('in');
      b.classList.add('pop');
      await sleep(680);
    }
    await sleep(300);
    walker.classList.remove('writing');

    // leaves the list on the table
    $('tableGroup').classList.add('show');
    await sleep(250);
    $('listGroup').classList.add('show');
    await sleep(450);
    for (const r of document.querySelectorAll('#listGroup .row')) {
      r.classList.add('show');
      await sleep(190);
    }
    await sleep(400);

    // walks off
    startWalking();
    await moveWalker(330, 980, 2500);
    stopWalking();

    // tagline
    $('caption').classList.add('show');
    $('replay').classList.add('show');
  }

  $('replay').addEventListener('click', () => location.reload());
  play();
})();
</script>
